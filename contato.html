<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <title>Contato - Matheus Nogueira Quintas</title>
        <link rel="stylesheet" href="contato.css">
    </head>

    <body>

        <main class="contato-page">

            <section class="contato-wrapper">

                <div class="formulario">
                    <h2>Contato</h2>
                    <h3>Envie sua mensagem</h3>

                    <label for="nome">Nome *</label>
                    <input type="text" id="nome" placeholder="Seu nome completo">

                    <label for="email">E-mail *</label>
                    <input type="email" id="email" placeholder="seu@email.com">

                    <label for="mensagem">Mensagem *</label>
                    <textarea id="mensagem" rows="5" placeholder="Digite sua mensagem"></textarea>

                    <button type="submit">Enviar Mensagem</button>
                </div>

                <div class="info">
                    <h3>E-mail</h3>
                    <p>qmatheusnogueira@gmail.com</p>

                    <h3>Redes Sociais</h3>
                    <ul class="redes">
                        <li><a href="https://github.com/MatheusQuintasdev" target="_blank">GitHub</a></li>
                        <li><a href="https://www.linkedin.com/in/matheus-quintass/" target="_blank">LinkedIn</a></li>
                    </ul>
                </div>

            </section>

        </main>

    </body>
</html>
